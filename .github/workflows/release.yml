name: Release

# Push a tag that matches the version in manifest.json (no "v" prefix), for example:
#   npm version 0.1.1 && git push --follow-tags
# The workflow builds the plugin, attests the build provenance of the release
# assets, and publishes them as a GitHub release.

on:
    push:
        tags: ["*"]

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: "npm"
            - run: npm ci
            - run: npm run build
            - run: npm run lint

            - name: Check that the tag matches manifest.json
              run: |
                  version=$(jq -r .version manifest.json)
                  if [ "$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
                      exit 1
                  fi

            - uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
